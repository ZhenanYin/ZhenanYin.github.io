- title: Research Experience
  type: time_table
  contents:
    - title: Tri-Modal Fusion for Parkinson's Disease Motor Phenotype Classification
      institution: Indiana University Indianapolis
      year: 2026 - Present
      image: Indiana_Hoosiers_logo.svg
      description:
        - Developed a hierarchical multimodal pipeline to classify 130 participants into Healthy Control, Tremor-Dominant PD, Intermediate PD, and PIGD PD using resting EEG, walking EEG, and clinical features derived from MDS-UPDRS Part III TD/PIGD ratios.
        - Built a two-stage architecture combining an XGBoost HC-vs-PD gate, EEGNet-Transformer rest/walk encoders, bidirectional EEG cross-attention, and clinical XGBoost soft fusion for within-PD subtype classification.
        - 'Improved 4-class LOGO macro-F1 by approximately +0.10 over flat trimodal cross-attention; validated with LOSO/LOGO evaluation, multi-seed robustness testing, bootstrap 95% CIs, and Wilcoxon signed-rank tests.'
        - 'Achieved 0.56 ± 0.02 macro-F1, 0.98 ± 0.01 HC-vs-PD gate AUC, and 0.43 ± 0.02 PD-only 3-class F1; used SHAP TreeExplainer to identify Color Trails Test and MoCA as dominant within-PD predictors.'

    - title: 'TriageGuard: LLM-Driven Continuous Security Testing for Open-Source EHRs'
      institution: Indiana University Indianapolis
      year: 2026 - Present
      image: Indiana_Hoosiers_logo.svg
      description:
        - Developed TriageGuard, a PR-triggered OpenMRS security-testing pipeline that converts code diffs into executable Gherkin/Playwright tests and validates them against a Dockerized OpenMRS instance through GitHub Actions CI.
        - Built a dual-LLM safety gate using Qwen-3-32B generation, GPT-OSS-120B review, SBERT semantic verification, and 13-condition approval logic to block unsafe AI-generated tests before execution.
        - 'Integrated CodeQL static analysis with 4 custom queries covering unprotected methods, privilege annotations, HTTP entry points, and caller chains; grounded test generation with an 8-profile Gherkin scenario library.'
        - 'Operationalized CVSS 4.0 risk-band scoring and a 4-signal composite risk model combining evidence density, OWASP pattern matching, CodeQL corroboration, and model self-reporting, with SHA-256 provenance for every LLM call.'

    - title: Multimodal EEG-IMU Fusion for Robust Motor Assessment
      institution: Indiana University Indianapolis
      year: 2025 - 2026
      image: Indiana_Hoosiers_logo.svg
      description:
        - Developed a multimodal motor-assessment framework integrating 16-channel EEG and wrist-worn IMU signals across 10 motor activities to evaluate neural and kinematic modality complementarity.
        - 'Implemented an EEGNet-Transformer model (~230K parameters) and a feature-engineered XGBoost IMU pipeline using 76 features per sensor across time-domain, frequency-domain, and 3D composite groups.'
        - 'Achieved 98.68 ± 0.32% activity-classification accuracy through logistic-regression late fusion, reducing EEG-only error by 81.5% and improving worst-task accuracy from ~87% to 96.76%.'
        - First-author paper accepted and presented at IEEE ICHI 2026.

    - title: Human-Guided Agentic AI for Multimodal Clinical Prediction
      institution: Indiana University Indianapolis
      year: 2025 - 2026
      image: Indiana_Hoosiers_logo.svg
      description:
        - 'Contributed to an AgentDS Healthcare benchmark submission; placed 5th overall in the healthcare domain and 3rd on discharge-readiness prediction.'
        - 'Led 30-day readmission prediction across 5,000 admissions, engineering 871 structured-EHR and discharge-note features from admission records, demographics, 5-year ED cost history, and trigram TF-IDF notes.'
        - 'Built a 5-base-model stacking ensemble using 3 XGBoost variants, L1/L2 logistic regression, and 8-fold out-of-fold meta-learning; achieved test Macro-F1 = 0.8986, within 0.006 of the top-ranked system.'
        - Co-author paper accepted and presented at IEEE ICHI 2026.

    - title: Frozen Foundation-Model Embeddings for Small-Lesion CXR Analysis
      institution: Indiana University Indianapolis
      year: 2025 - 2026
      image: Indiana_Hoosiers_logo.svg
      description:
        - Co-investigated preservation of small-scale diagnostic signal in frozen ViT foundation-model embeddings for chest radiography across 5 frozen models evaluated on NIH-CXR14, MIMIC-CXR, Emory-CXR, and ChestX-Det10 cohorts.
        - 'Evaluated 492,724 chest radiographs and 3,543 ChestX-Det10 images with 1,462 lesion boxes across calcification, nodule, and mass categories.'
        - 'Demonstrated CLS pooling collapses small-scale signal to chance-level AUC = 0.500–0.524, while ROI-conditioned patch tokens recover ~AUC = 1.0 with mean per-model gains of +0.412 to +0.488.'
        - Second-author manuscript under review at Medical Image Analysis.

    - title: Summer Research Assistant
      institution: Pembroke College, University of Cambridge, UK
      year: 2024
      image: Pembroke.png
      description:
        - Advised by Dr. Bridget Bannerman & Prof. Jorge Júlvez
        - Conducted systems biology modeling to investigate how Mycobacterium tuberculosis infection alters macrophage metabolism and contributes to lung cancer progression.
        - 'Implemented genome-scale metabolic models (iAB-AMØ-1410, iAB-AMØ-1410-Mt-661) in COBRApy to perform Flux Balance and Flux Variability Analyses for host–pathogen interaction mapping.'
        - Identified 223 infection-specific essential reactions and quantified nutrient dependencies through medium minimization to reveal candidate metabolic drug targets.
        - Simulated infection-induced metabolic burden, showing a 92% reduction in macrophage biomass growth rate due to Mtb-driven energetic constraints.

    - title: Undergraduate Research Assistant
